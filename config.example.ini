[server]
host = 0.0.0.0
; Use a port other than 80: the router's web proxy hijacks port 80 for overdue users.
port = 8080
; Change this to a long random string.
secret_key = CHANGE_ME
database = billing.db

[admin]
; Set with:  python manage.py set-password
password_hash =
; The admin pages refuse requests coming from these networks (the overdue pool).
blocked_nets = 10.69.0.0/23

[router]
; mode = mock  (reads mock_router.json)  or  api  (talks to the RB4011)
mode = mock
mock_file = mock_router.json
host = 192.168.88.1
port = 8728
user = billing-ro
password =

[page]
business_name = GKTech
gcash_name = YOUR NAME HERE
gcash_number = 09XX XXX XXXX
contact = Message us on Facebook or call 09XX XXX XXXX
extra_note = Please send a screenshot of your GCash receipt to confirm payment.
